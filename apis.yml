name: MobileIron
description: 'MobileIron was a pioneer in mobile device management (MDM) and enterprise
  mobility management (EMM), later unified endpoint management (UEM), securing mobile
  devices, applications, and content for enterprises with capabilities such as Zero
  Sign-On, Mobile Threat Defense, and secure connectivity. Backed by Norwest Venture
  Partners, the company was acquired by Ivanti on December 1, 2020, and its platform
  capabilities are now delivered inside the Ivanti product suite. The mobileiron.com
  domain now redirects to Ivanti, and MobileIron no longer operates an independent
  developer or public API program.'
