- slug: mobileiron-cloud-security-alliance-star-registry
  label: Cloud Security Alliance STAR Registry
  partner_name: Cloud Security Alliance STAR Registry
  category: Cloud security assurance
  type: register
  channel: standard-directory
  evidence: https://cloudsecurityalliance.org/star/registry/mobileiron-emm/services/mobileiron-emm
  source: edge
  relationship: standard-participant
  contract_reference:
    register: CSA STAR Registry (cloudsecurityalliance.org/star/registry)
    spec_file: null
    standard: CSA STAR
    role: star-level-1
    registered_name: MobileIron EMM
    registry_id: mobileiron-emm
    service_url: http://www.mobileiron.com/
    matched_domain: mobileiron.com
    matched_by: domain
    identity_source: the service URL the organisation filed on its STAR listing (no lookup)
    levels:
    - STAR Level 1
    certified_products: []
    signal_note: STAR Level 1 (CAIQ self-assessment) = participation; certified_products = one entry per STAR Level
      2 / STAR for AI Level 2 assessment TYPE (third-party certification, attestation, C-STAR, ValidAIted); lapsed
      = every instance marked (Deprecated) by the registry; service counts never recorded
    detected_by: sweep-compliance-assurance.py
    detected: '2026-10-20'
  status: not-a-workflow
  arazzo: null
- slug: mobileiron-common-criteria-portal-ccra-certified-products
  label: Common Criteria Portal (CCRA certified products)
  partner_name: Common Criteria Portal (CCRA certified products)
  category: Common Criteria (ISO/IEC 15408) product certification
  type: register
  channel: standard-directory
  evidence: https://www.commoncriteriaportal.org/products/
  source: edge
  relationship: standard-participant
  contract_reference:
    register: Common Criteria Portal certified products + archived certificates (commoncriteriaportal.org/products/certified_products.csv,
      certified_products-archived.csv)
    standard: ISO/IEC 15408 Common Criteria for Information Technology Security Evaluation (CCRA)
    spec_file: null
    role: cc-certified-manufacturer
    registered_name: MobileIron
    matched_domain: null
    matched_by: register-name
    certified_products:
    - product: Mobility
      product_type: Mobility
      standard: ISO/IEC 15408 Common Criteria for Information Technology Security Evaluation (CCRA)
      lapsed: true
      protection_profiles:
      - EP_MDM_AGENT_V3.0
      - PP_MDM_AGENT_V2.0
      - PP_MDM_V2.0
      - PP_MDM_V3.0
      schemes:
      - US
    signal_note: 'certified_products = one entry per Common Criteria product CATEGORY held (highest EAL for that
      category in partner_tier; a category held only among archived certificates is lapsed: true); certificate and
      product counts are context, never counted'
    detected_by: sweep-common-criteria-certified-products.py
    detected: '2026-10-21'
    register_name_note: register-name 'mobileiron' = mobileiron; wikidata P856 mobileiron.com agrees or unheld
    identity_source: register-name
    identity_note: register gave only the name; exact normalised match to the repo's apis.yml name, one repo, Wikidata
      P856 not contradicting (Kin 2026-10-20 decision 2)
  status: not-a-workflow
  arazzo: null
